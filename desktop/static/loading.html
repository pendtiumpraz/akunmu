<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>AkunMu</title>
    <style>
      :root {
        --canvas: #f4f6f8;
        --muted: #5f6e7f;
        --tile: #0f766e;
        --on-tile: #ffffff;
      }
      :root[data-theme="dark"] {
        --canvas: #0a0f14;
        --muted: #8d9cab;
        --tile: #2dd4bf;
        --on-tile: #032622;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: var(--canvas);
        font: 500 14px/1.4 "Segoe UI", system-ui, sans-serif;
        color: var(--muted);
        user-select: none;
      }
      main {
        display: grid;
        justify-items: center;
        gap: 18px;
      }
      svg {
        width: 72px;
        height: 72px;
      }
      .leaf {
        transform-box: fill-box;
        transform-origin: center;
        animation: grow 1.6s ease-in-out infinite;
      }
      .leaf:nth-of-type(2) {
        animation-delay: 0.2s;
      }
      .leaf:nth-of-type(3) {
        animation-delay: 0.4s;
      }
      @keyframes grow {
        50% {
          transform: scale(0.6);
          opacity: 0.6;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .leaf {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <!-- The app's mark: an account tree in a tile (src/shared/ui/logo.tsx). -->
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="var(--tile)" />
        <path d="M16 24.5V10.5M16 19.5 10.5 13.5M16 16.5l5.5-5.2" stroke="var(--on-tile)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.72" />
        <circle cx="16" cy="25" r="2.7" fill="var(--on-tile)" />
        <circle class="leaf" cx="10" cy="12.8" r="2.5" fill="var(--on-tile)" />
        <circle class="leaf" cx="22" cy="10.6" r="2.5" fill="var(--on-tile)" />
        <circle class="leaf" cx="16" cy="8.2" r="2.3" fill="var(--on-tile)" opacity="0.85" />
      </svg>
      <p id="text" role="status"></p>
    </main>
    <script>
      const query = new URLSearchParams(location.search);
      document.documentElement.dataset.theme = query.get("theme") === "dark" ? "dark" : "light";
      document.getElementById("text").textContent = query.get("text") || "AkunMu";
    </script>
  </body>
</html>
