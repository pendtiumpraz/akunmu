<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AkunMu</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header class="bar">
      <img src="icons/icon-32.png" alt="" width="24" height="24" />
      <strong>AkunMu</strong>
      <button type="button" id="check" class="button ghost" hidden>
        <span class="spin" aria-hidden="true"></span>
        <span data-i18n="checkNow"></span>
      </button>
    </header>

    <main>
      <section class="block">
        <h2 data-i18n="thisProfile"></h2>
        <form id="profile" class="row">
          <label class="field grow">
            <span data-i18n="profileLabel"></span>
            <input id="profile-name" maxlength="60" autocomplete="off" required />
          </label>
          <label class="field">
            <span data-i18n="browserLabel"></span>
            <select id="profile-browser">
              <option value="chrome">Chrome</option>
              <option value="edge">Edge</option>
              <option value="brave">Brave</option>
              <option value="vivaldi">Vivaldi</option>
              <option value="opera">Opera</option>
              <option value="arc">Arc</option>
            </select>
          </label>
        </form>
        <p class="hint" id="profile-email"></p>
      </section>

      <section class="block">
        <h2 data-i18n="connections"></h2>
        <ul id="connections" class="list"></ul>
        <button type="button" id="add" class="button soft" data-i18n="addConnection" hidden></button>
        <form id="connect" class="stack" hidden>
          <label class="field">
            <span data-i18n="addressLabel"></span>
            <input id="address" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://" required />
            <small data-i18n="addressHint"></small>
          </label>
          <label class="field">
            <span data-i18n="keyLabel"></span>
            <input id="key" autocomplete="off" spellcheck="false" placeholder="akm_…" required />
            <small data-i18n="keyHint"></small>
          </label>
          <p id="connect-error" class="error" role="alert" hidden></p>
          <div class="row">
            <button type="submit" id="connect-button" class="button primary" data-i18n="connectButton"></button>
            <button type="button" id="cancel" class="button ghost" data-i18n="cancel"></button>
          </div>
        </form>
      </section>

      <label class="toggle">
        <input type="checkbox" id="discover" />
        <span>
          <strong data-i18n="discoverLabel"></strong>
          <small data-i18n="discoverHint"></small>
        </span>
      </label>

      <p class="privacy" data-i18n="privacy"></p>
    </main>
  </body>
</html>
